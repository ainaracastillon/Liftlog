<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0F6E56">
<meta name="description" content="Liftlog: tu libreta de gimnasio. Monta tu rutina, apunta peso y repeticiones y mira cómo progresas.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Liftlog">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>html{color-scheme:light}body{margin:0;padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Liftlog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: app de una columna, cabecera fija arriba, barra de pestañas abajo; las cifras van en condensada tipo marcador */
:root{
  --bg:#F1F5F3; --surface:#FFFFFF; --surface-2:#E8EFEB; --fg:#13211C; --muted:#5A6A63; --line:#D8E2DD;
  --accent:#0F6E56; --accent-2:#1D9E75; --accent-soft:#E1F5EE; --on-accent:#FFFFFF;
  --up:#1D8A64; --up-soft:#DDF3E8; --down:#B9452B; --down-soft:#FBE7E1; --same:#5A6A63;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#16201C; --surface-2:#1D2925; --fg:#E5EEEA; --muted:#8FA39A; --line:#27342F;
  --accent:#5DCAA5; --accent-2:#5DCAA5; --accent-soft:#12372D; --on-accent:#04342C;
  --up:#6FD3A9; --up-soft:#123A2C; --down:#F0997B; --down-soft:#3A1D15; --same:#8FA39A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#16201C; --surface-2:#1D2925; --fg:#E5EEEA; --muted:#8FA39A; --line:#27342F;
  --accent:#5DCAA5; --accent-2:#5DCAA5; --accent-soft:#12372D; --on-accent:#04342C;
  --up:#6FD3A9; --up-soft:#123A2C; --down:#F0997B; --down-soft:#3A1D15; --same:#8FA39A; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.sync{margin-left:auto;margin-right:4px;white-space:nowrap;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--accent-2)}
main{padding-block:16px 110px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs button{background:none;border:0;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;min-width:0;font-weight:500;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
h2.sec{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:500;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.small{padding:5px 9px;font-size:13px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.iconbtn svg{width:18px;height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.datebar .d{flex:1;min-width:0}
.datebar .d b{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;display:block}
.ex-h{display:flex;align-items:flex-start;gap:10px}
.ex-h .n{flex:1;min-width:0}
.ex-h .n b{font-weight:600;font-size:16px;display:block}
.ex-h .n span{font-size:13px;color:var(--muted)}
.prev{margin-top:8px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.set-pill{font-family:var(--display);font-weight:600;font-size:16px;color:var(--fg);background:var(--surface-2);border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}
.set-pill em{font-style:normal;color:var(--muted);font-weight:500}
.sets{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:26px minmax(0,1fr) 14px minmax(0,1fr) 30px;gap:6px;align-items:center}
.setrow .no{font-family:var(--display);font-weight:600;color:var(--muted);font-size:16px;text-align:center}
.setrow .x{color:var(--muted);text-align:center;font-size:13px}
.field{position:relative}
.field input{width:100%;height:42px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 34px 0 10px;font-family:var(--display);font-weight:600;font-size:21px;font-variant-numeric:tabular-nums}
.field input:focus{border-color:var(--accent);outline:none}
.field span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.del{background:none;border:0;color:var(--muted);padding:0;width:30px;height:30px;display:grid;place-items:center;border-radius:8px}
.del svg{width:16px;height:16px}
.ex-foot{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.badge.up{background:var(--up-soft);color:var(--up)}
.badge.down{background:var(--down-soft);color:var(--down)}
.badge.same{background:var(--surface-2);color:var(--same)}
.badge.pr{background:var(--accent);color:var(--on-accent)}
.notes{margin-top:10px}
.notes textarea{width:100%;min-height:42px;border:1px dashed var(--line);border-radius:10px;padding:9px 10px;background:transparent;font-family:var(--display);font-size:18px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-head b{flex:1;font-family:var(--display);font-weight:700;font-size:28px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:4px;letter-spacing:.06em}
.cal button{aspect-ratio:1/1.12;max-width:100%;border:1px solid transparent;background:var(--surface);border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;min-width:0}
.cal button .num{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.1}
.cal button .tag{font-size:10px;font-weight:600;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.cal button.out{visibility:hidden}
.cal button.today{border-color:var(--accent)}
.cal button.done{background:var(--accent-soft)}
.cal button.done .tag{color:var(--accent)}
.cal button.sel{outline:2px solid var(--accent);outline-offset:-2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.daycard .dh{display:flex;align-items:center;gap:8px}
.daycard .dh .dn{font-family:var(--display);font-weight:700;font-size:20px;color:var(--accent);width:28px}
.txt{width:100%;height:40px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 10px;min-width:0}
.txt.title{font-weight:600;font-size:16px}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) 54px 64px 30px;gap:6px;align-items:center;margin-top:8px}
.exrow input{height:38px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:0 8px;min-width:0;width:100%}
.exrow input.num{text-align:center;font-family:var(--display);font-weight:600;font-size:17px}
.exlabels{display:grid;grid-template-columns:minmax(0,1fr) 54px 64px 30px;gap:6px;margin-top:10px;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.exlabels span:nth-child(2),.exlabels span:nth-child(3){text-align:center}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.stepper button{width:44px;height:44px;border:0;background:none;font-size:22px;font-weight:500}
.stepper b{font-family:var(--display);font-weight:700;font-size:26px;min-width:36px;text-align:center}
select.sel{height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px;width:100%;font-weight:500}
.chart{width:100%;height:auto;display:block}
.hist{display:flex;flex-direction:column}
.hist .h{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hist .h:first-child{border-top:0}
.hist .h .dt{font-size:13px;color:var(--muted)}
.hist .h .ss{display:flex;flex-wrap:wrap;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500;z-index:20}
.avatar{width:34px;height:34px;border-radius:50%;border:0;color:#fff;font-weight:600;font-size:13px;display:grid;place-items:center;flex:0 0 auto;background:#0F6E56}
.avatar.big{width:44px;height:44px;font-size:15px}
.wdrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:10px}
.wd{height:34px;border:1px solid var(--line);background:var(--bg);border-radius:9px;font-family:var(--display);font-weight:700;font-size:16px;color:var(--muted);padding:0}
.wd[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.wd.taken{border-style:dashed}
.cal button.plan .tag{color:var(--muted)}
.cal button.plan{border:1px dashed var(--line)}
.lab{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.lab .txt{color:var(--fg);font-weight:400;font-size:15px}
.err{color:var(--down);font-size:13.5px;margin:0}
.auth{max-width:380px;margin:20px auto 0;display:flex;flex-direction:column;gap:10px}
.auth .hint{margin:0 0 6px}
body.locked nav.tabs,body.locked #avatar,body.locked #sync{display:none}
.pwfield{position:relative;display:block}
.pwfield .txt{padding-right:46px}
.eye{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:38px;height:34px;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:8px;padding:0}
.eye svg{width:20px;height:20px}
.eye:hover{color:var(--fg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 0;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpis .stat b{font-size:30px}
.ulist{padding:4px 14px}
.urow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;text-align:left}
.ulist .urow:first-child{border-top:0}
.uinfo{min-width:0;display:flex;flex-direction:column}
.uinfo .hint{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unum{text-align:right;display:flex;flex-direction:column}
.unum b{font-family:var(--display);font-size:22px;line-height:1}
.adm-top{display:flex;justify-content:space-between;align-items:center}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.reload{width:34px;height:34px;border-radius:50%;margin-right:2px}
.reload.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.exbar{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:10px}
.exlist{display:flex;flex-direction:column;gap:8px}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.excard>button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;background:none;border:0;padding:12px 14px;text-align:left}
.excard>button b{font-weight:600;font-size:15.5px;display:block}
.excard>button .hint{display:block;margin-top:2px}
.gtag{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 9px;white-space:nowrap}
.exbody{padding:0 14px 14px;border-top:1px solid var(--line)}
.exbody ol{margin:12px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.exbody .tip{margin-top:10px;background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13.5px}
.exmeta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.exmeta b{color:var(--fg);font-weight:600}
.inr{font-size:12px;font-weight:600;color:var(--up)}
.exadd{display:flex;gap:8px;margin-top:12px}
.exadd select{flex:1;min-width:0}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.daypv{display:grid;grid-template-columns:28px minmax(0,1fr) 20px;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.daypv:hover{border-color:var(--accent)}
.daypv .dn{font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent);align-self:start}
.dpv-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.dpv-main b{font-weight:600;font-size:16.5px}
.dpv-wd{font-size:13px;font-weight:600;color:var(--accent)}
.dpv-names{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:20px;height:20px;color:var(--muted)}
.txt.dname{margin-top:4px;height:48px;font-family:var(--display);font-weight:700;font-size:28px;background:transparent;border-color:transparent;padding:0 6px;margin-left:-6px;width:calc(100% + 6px)}
.txt.dname:focus{border-color:var(--accent);background:var(--surface);outline:none}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-x:none}
button,a,input,select,textarea,label{touch-action:manipulation}
.txt,.lab .txt,.exrow input,.sel,select.sel,input[type=search]{font-size:16px}
</style>
</head>
<body>


<header class="top"><div class="wrap">
  <svg width="38" height="38" viewBox="0 0 72 72" aria-hidden="true"><rect width="72" height="72" rx="16" fill="#0F6E56"/><rect x="10" y="30" width="52" height="4" rx="2" fill="#E1F5EE"/><rect x="14" y="20" width="7" height="24" rx="2" fill="#5DCAA5"/><rect x="51" y="20" width="7" height="24" rx="2" fill="#5DCAA5"/><rect x="21" y="24" width="4" height="16" rx="1.5" fill="#9FE1CB"/><rect x="47" y="24" width="4" height="16" rx="1.5" fill="#9FE1CB"/><rect x="18" y="52" width="36" height="3" rx="1.5" fill="#9FE1CB"/><rect x="18" y="58" width="22" height="3" rx="1.5" fill="#5DCAA5"/></svg>
  <div class="brand">Liftlog<small>Tu libreta de gym</small></div>
  <div class="sync" id="sync"><i></i><span>En este móvil</span></div>
  <button class="iconbtn reload" id="reload" data-act="reload" aria-label="Recargar datos" title="Recargar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  <button class="avatar" id="avatar" data-act="profiles" aria-label="Usuarios y cuenta">?</button>
</div></header>

<main><div class="wrap" id="view"></div></main>

<nav class="tabs" aria-label="Secciones"><div class="wrap">
  <button data-tab="entreno"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Entreno</button>
  <button data-tab="calendario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Calendario</button>
  <button data-tab="rutina"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Rutina</button>
  <button data-tab="ejercicios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>Ejercicios</button>
  <button data-tab="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 15l4-4 4 3 6-7"/></svg>Progreso</button>
</div></nav>

<script>
(function noZoom(){
  const vp=document.querySelector('meta[name=viewport]');
  if(vp)vp.setAttribute("content","width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover");
  ["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
  document.addEventListener("touchmove",e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});

const sortedDates=()=>Object.keys(S.logs).sort();
const dayById=id=>S.routine.days.find(d=>d.id===id);
function exIndex(){const m={};S.routine.days.forEach(d=>d.ex.forEach(x=>m[x.id]={...x,day:d.name}));for(const k of sortedDates()){const L=S.logs[k];for(const id in L.entries||{})if(!m[id])m[id]={id,name:L.entries[id].name,day:L.dayName,orphan:true}}return m}
const validSets=sets=>(sets||[]).filter(s=>num(s.w)!=null&&num(s.r)!=null&&num(s.r)>0);
function prevFor(exId,date){const ds=sortedDates().filter(d=>d<date).reverse();for(const d of ds){const e=S.logs[d].entries?.[exId];if(e&&validSets(e.sets).length)return{date:d,sets:validSets(e.sets)}}return null}
function topOf(sets){let t=null;for(const s of sets){const w=num(s.w),r=num(s.r);if(!t||w>t.w||(w===t.w&&r>t.r))t={w,r}}return t}
const e1rm=(w,r)=>w*(1+r/30);
function bestBefore(exId,date){let b=0;for(const d of sortedDates()){if(d>=date)break;const e=S.logs[d].entries?.[exId];for(const s of validSets(e?.sets))b=Math.max(b,num(s.w))}return b}
function compare(exId,date,sets){
  const cur=validSets(sets);if(!cur.length)return[];
  const out=[];const t=topOf(cur);
  const best=bestBefore(exId,date);
  const prev=prevFor(exId,date);
  if(prev){
    const p=topOf(prev.sets);const dw=Math.round((t.w-p.w)*100)/100;
    if(dw>0)out.push(["up","↑ +"+fmtKg(dw)+" kg"]);
    else if(dw<0)out.push(["down","↓ "+fmtKg(dw)+" kg"]);
    else{const dr=t.r-p.r;out.push(dr>0?["up","↑ +"+dr+" reps"]:dr<0?["down","↓ "+dr+" reps"]:["same","= igual que la última"])}
    if(dw!==0){const dr=t.r-p.r;if(dr>0)out.push(["up","+"+dr+" reps"]);else if(dr<0)out.push(["down",dr+" reps"])}
  }else out.push(["same","Primera vez"]);
  if(best>0&&t.w>best)out.unshift(["pr","Récord"]);
  return out;
}
const setsText=sets=>validSets(sets).map(s=>fmtKg(num(s.w))+"("+num(s.r)+")").join(", ");
function parseNotes(txt){const out=[];const re=/(\d+(?:[.,]\d+)?)\s*\(\s*(\d+)\s*\)/g;let m;while((m=re.exec(txt)))out.push({w:num(m[1]),r:+m[2]});return out}
const plannedFor=date=>{const w=parseD(date).getDay();return S.routine.days.find(d=>(d.wd||[]).includes(w))||null};
const anyPlanned=()=>S.routine.days.some(d=>(d.wd||[]).length);
function suggestDay(date){const L=S.logs[date];if(L&&dayById(L.dayId))return L.dayId;const p=plannedFor(date);if(p)return p.id;const ds=sortedDates().filter(d=>d<date);const last=ds.length?S.logs[ds[ds.length-1]]:null;const days=S.routine.days;if(!days.length)return null;if(!last)return days[0].id;const i=days.findIndex(d=>d.id===last.dayId);return days[(i+1)%days.length].id}

    <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn small" data-act="addex" data-id="${d.id}">+ Ejercicio</button><button class="btn small ghost" data-tab-go="ejercicios">Buscar en la biblioteca</button></div>
    <p class="hint" style="margin:10px 0 0">Las repes admiten rangos, por ejemplo 8-12. Los cambios se guardan solos.</p></div>
  <div style="margin-top:16px">${ui.confirm==="delday:"+d.id?`<div class="card confirm">¿Quitar el día «${esc(d.name)}»? Tus registros se conservan. <button class="btn small" data-act="deldayyes" data-id="${d.id}" style="color:var(--down)">Quitar</button><button class="btn small ghost" data-act="clearno">Cancelar</button></div>`:`<button class="btn ghost small" style="color:var(--down);padding-left:0" data-act="delday" data-id="${d.id}">Quitar este día</button>`}</div>`;
  return h;
}

function vProgreso(){
  const idx=exIndex();
  const withData=Object.values(idx).filter(x=>sortedDates().some(d=>validSets(S.logs[d].entries?.[x.id]?.sets).length));
  let h=`<span class="eyebrow">Evolución</span><h2 class="sec" style="margin-bottom:12px">Progreso</h2>`;
  if(!withData.length)return h+`<div class="card empty">Cuando apuntes tus primeras series, aquí verás cómo sube el peso de cada ejercicio.</div>`;
  if(!ui.progEx||!withData.find(x=>x.id===ui.progEx))ui.progEx=withData[0].id;
  h+=`<select class="sel" id="progsel" aria-label="Ejercicio">${withData.map(x=>`<option value="${x.id}" ${x.id===ui.progEx?"selected":""}>${esc(x.name)} · ${esc(x.day||"")}</option>`).join("")}</select>`;
  const pts=sortedDates().map(d=>{const s=validSets(S.logs[d].entries?.[ui.progEx]?.sets);return s.length?{d,sets:s,top:topOf(s),rm:Math.max(...s.map(z=>e1rm(num(z.w),num(z.r))))}:null}).filter(Boolean);
  const best=Math.max(...pts.map(p=>p.top.w));const first=pts[0].top.w,last=pts[pts.length-1].top.w;
  h+=`<div class="stats"><div class="stat"><b>${fmtKg(best)}</b><span>kg máximo</span></div><div class="stat"><b>${fmtKg(Math.round(pts[pts.length-1].rm*10)/10)}</b><span>1RM estimado</span></div><div class="stat"><b style="color:${last-first>0?"var(--up)":last-first<0?"var(--down)":"var(--fg)"}">${last-first>0?"+":""}${fmtKg(last-first)}</b><span>kg desde el inicio</span></div></div>`;
  h+=`<div class="card">${chartSVG(pts)}<div class="row hint" style="gap:14px;margin-top:6px"><span><span style="display:inline-block;width:14px;height:3px;background:var(--accent);vertical-align:middle;border-radius:2px"></span> Peso máximo</span><span><span style="display:inline-block;width:14px;height:0;border-top:2px dashed var(--muted);vertical-align:middle"></span> 1RM estimado</span></div></div>`;
  h+=`<div class="eyebrow" style="margin:16px 0 8px">Historial</div><div class="card hist">${pts.slice().reverse().map(p=>`<div class="h"><span class="dt">${shortDate(p.d)}</span><span class="ss">${p.sets.map(s=>`<span class="set-pill">${fmtKg(num(s.w))}<em>(${num(s.r)})</em></span>`).join("")}</span><span>${compare(ui.progEx,p.d,p.sets).slice(0,1).map(([c,t])=>`<span class="badge ${c}">${t}</span>`).join("")}</span></div>`).join("")}</div>`;
  return h;
}
function chartSVG(pts){
  const W=340,H=180,L=36,R=12,T=14,B=26;
  const ys=pts.flatMap(p=>[p.top.w,p.rm]);let lo=Math.min(...ys),hi=Math.max(...ys);
  if(hi===lo){hi+=5;lo=Math.max(0,lo-5)}const span=hi-lo;lo=Math.max(0,lo-span*.12);hi=hi+span*.12;
  const step=(()=>{const raw=(hi-lo)/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));for(const m of[1,2,2.5,5,10])if(raw<=m*p)return m*p;return 10*p})();
  const t0=Math.ceil(lo/step)*step;const ticks=[];for(let v=t0;v<=hi+1e-9;v+=step)ticks.push(Math.round(v*100)/100);
  const x=i=>pts.length===1?(L+W-R)/2:L+(W-L-R)*i/(pts.length-1);const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const line=k=>pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(k(p)).toFixed(1)).join(" ");
  const area=line(p=>p.top.w)+` L${x(pts.length-1).toFixed(1)} ${H-B} L${x(0).toFixed(1)} ${H-B} Z`;
  const lab=[0,pts.length-1];if(pts.length>4)lab.splice(1,0,Math.floor((pts.length-1)/2));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de peso máximo por sesión">
  ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Figtree,sans-serif">${fmtKg(v)}</text>`).join("")}
  ${pts.length>1?`<path d="${area}" fill="var(--accent)" opacity=".12"/>`:""}
  <path d="${line(p=>p.rm)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="${line(p=>p.top.w)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.top.w)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`).join("")}
  ${[...new Set(lab)].map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="${pts.length===1?"middle":i===0?"start":i===pts.length-1?"end":"middle"}" font-size="11" fill="var(--muted)" font-family="Figtree,sans-serif">${shortDate(pts[i].d)}</text>`).join("")}
  </svg>`;
}

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>{if(b.dataset.tab===ui.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  const P=profById(ALL.active)||ALL.profiles[0];const av=$("#avatar");const nm=SERVER?SERVER.user.name:P.name;av.textContent=initials(nm);av.style.background=SERVER?COLORS[0]:P.color;av.title=nm;

}

function ensureLog(){
  const day=dayById(selDay);
  let L=S.logs[ui.date];
  if(!L||L.dayId!==selDay){L={date:ui.date,dayId:selDay,dayName:day.name,entries:{}};S.logs[ui.date]=L}
  L.dayName=day.name;return L;
}
function getSets(exId){const L=ensureLog();const x=dayById(selDay).ex.find(e=>e.id===exId);if(!L.entries[exId])L.entries[exId]={name:x?x.name:"",sets:[{w:"",r:""}]};return L.entries[exId].sets}
function cleanup(){const L=S.logs[ui.date];if(!L)return;for(const k in L.entries){if(!validSets(L.entries[k].sets).length&&L.entries[k].sets.every(s=>(s.w===""||s.w==null)&&(s.r===""||s.r==null)))delete L.entries[k]}if(!Object.keys(L.entries).length)delete S.logs[ui.date]}
function refreshBadges(exId){const card=document.querySelector(`.card[data-ex="${exId}"]`);if(!card)return;const L=S.logs[ui.date];const sets=L?.entries?.[exId]?.sets||[];card.querySelector(".badges").innerHTML=badgesHTML(exId,ui.date,sets);const ta=card.querySelector("textarea");if(ta&&document.activeElement!==ta)ta.value=setsText(sets)}

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.k){const sets=getSets(t.dataset.ex);const i=+t.dataset.i;while(sets.length<=i)sets.push({w:"",r:""});
    sets[i][t.dataset.k]=t.dataset.k==="w"?(num(t.value)??""):(t.value.replace(/\D/g,"")===""?"":+t.value.replace(/\D/g,""));
    refreshBadges(t.dataset.ex);persist("log-"+ui.date);return}
  if(t.dataset.notes){const p=parseNotes(t.value);const L=ensureLog();const x=dayById(selDay).ex.find(z=>z.id===t.dataset.notes);L.entries[t.dataset.notes]={name:x.name,sets:p.length?p:[{w:"",r:""}]};refreshBadges(t.dataset.notes);persist("log-"+ui.date);return}
  if(t.dataset.profname){const p=profById(t.dataset.profname);p.name=t.value;persistProfiles();const av=$("#avatar");if(p.id===ALL.active){av.textContent=initials(p.name)}return}
  if(t.dataset.dayname){const d=dayById(t.dataset.dayname);d.name=t.value;persist("routine");return}
  if(t.dataset.exf){const d=dayById(t.dataset.day);const x=d.ex.find(z=>z.id===t.dataset.x);if(t.dataset.exf==="sets"){const n=parseInt(t.value);x.sets=isNaN(n)?"":Math.min(20,Math.max(1,n))}else x[t.dataset.exf]=t.value;persist("routine");return}
});

document.addEventListener("click",e=>{
  const tb=e.target.closest("nav.tabs button,[data-tab-go]");
  if(tb){ui.tab=tb.dataset.tab||tb.dataset.tabGo;ui.confirm=null;if(tb.dataset.tab)ui.rutDay=null;render();window.scrollTo(0,0);return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case"dprev":ui.date=addDays(ui.date,-1);ui.confirm=null;ui.notesOpen=null;break;
    case"dnext":ui.date=addDays(ui.date,1);ui.confirm=null;ui.notesOpen=null;break;

    case"addset":{const sets=getSets(id);const last=sets[sets.length-1];sets.push({w:last&&last.w!==""?last.w:"",r:""});persist("log-"+ui.date);render();const i=sets.length-1;const el=document.getElementById("r-"+id+"-"+i);el&&el.focus();return}
    case"delset":{const L=S.logs[ui.date];const sets=L?.entries?.[id]?.sets;if(sets){sets.splice(+b.dataset.i,1);if(!sets.length)sets.push({w:"",r:""});cleanup();persist("log-"+ui.date)}break}
    case"copyprev":{const p=prevFor(id,ui.date);if(p){const L=ensureLog();L.entries[id]={name:dayById(selDay).ex.find(z=>z.id===id).name,sets:p.sets.map(s=>({w:num(s.w),r:num(s.r)}))};persist("log-"+ui.date);toast("Copiado de la última sesión")}break}
    case"clearask":ui.confirm="clearday";break;
    case"clearyes":delete S.logs[ui.date];persist("log-"+ui.date);ui.confirm=null;toast("Registro borrado");break;
    case"clearno":ui.confirm=null;break;
    case"mprev":case"mnext":{const[y,m]=ui.month.split("-").map(Number);const d=new Date(y,m-1+(a==="mnext"?1:-1),1);ui.month=d.getFullYear()+"-"+pad(d.getMonth()+1);break}
    case"goday":ui.date=b.dataset.d;ui.tab="entreno";ui.confirm=null;ui.notesOpen=null;selDay=null;window.scrollTo(0,0);break;
    case"dplus":if(S.routine.days.length<7){const nd={id:uid(),name:"Día "+(S.routine.days.length+1),wd:[],ex:[]};S.routine.days.push(nd);persist("routine");ui.rutDay=nd.id;ui.tab="rutina";window.scrollTo(0,0)}else toast("Máximo 7 días");break;
    case"rutopen":ui.rutDay=id;ui.confirm=null;window.scrollTo(0,0);break;
    case"rutback":ui.rutDay=null;ui.confirm=null;window.scrollTo(0,0);break;
    case"dminus":{const d=S.routine.days[S.routine.days.length-1];if(!d)break;if(d.ex.length){ui.confirm="delday:"+d.id}else{S.routine.days.pop();persist("routine")}break}
    case"delday":{const d=dayById(id);if(d.ex.length)ui.confirm="delday:"+id;else{S.routine.days=S.routine.days.filter(z=>z.id!==id);ui.rutDay=null;persist("routine")}break}
    case"deldayyes":S.routine.days=S.routine.days.filter(z=>z.id!==id);ui.confirm=null;ui.rutDay=null;persist("routine");toast("Día quitado");break;
    case"addex":{const d=dayById(id);const x={id:uid(),name:"",sets:3,reps:"10"};d.ex.push(x);persist("routine");render();const el=document.getElementById("xn-"+x.id);el&&el.focus();return}
    case"wd":{const d=dayById(id);const w=+b.dataset.w;d.wd=d.wd||[];if(d.wd.includes(w))d.wd=d.wd.filter(x=>x!==w);else{S.routine.days.forEach(o=>{if(o.wd)o.wd=o.wd.filter(x=>x!==w)});d.wd.push(w)}persist("routine");break}
    case"profiles":ui.tab="perfiles";ui.confirm=null;window.scrollTo(0,0);break;
    case"useprof":switchProfile(id);persistProfiles();ui.tab="entreno";toast("Ahora entrenas como "+profById(id).name);break;
    case"addprof":{const inp=document.getElementById("newprof");const name=(inp?.value||"").trim();if(!name){ui.profErr="Escribe un nombre para el usuario";break}ui.profErr=null;const p={id:uid(),name,color:COLORS[ALL.profiles.length%COLORS.length]};ALL.profiles.push(p);ALL.data[p.id]=defaults(false);persistProfiles();persist("routine",p.id);switchProfile(p.id);ui.tab="rutina";toast("Usuario creado. Ajusta su rutina");break}
    case"delprof":ui.confirm="delprof:"+id;break;
    case"delprofyes":{if(ALL.profiles.length<2)break;const D=ALL.data[id];ALL.profiles=ALL.profiles.filter(p=>p.id!==id);if(store&&D){store.ref(keyFor(id,"routine")).delete().catch(()=>{});for(const d in D.logs)store.ref(keyFor(id,"log-"+d)).delete().catch(()=>{})}delete ALL.data[id];if(ALL.active===id)switchProfile(ALL.profiles[0].id);persistProfiles();ui.confirm=null;toast("Usuario eliminado");break}
    case"logout":logout();return;
    case"reload":reloadData();return;
    case"exopen":{const i=+b.dataset.i;EXQ.open=EXQ.open===i?null:i;break}
    case"exclear":EXQ.q="";EXQ.g="";EXQ.open=null;break;
    case"exadd":{const i=+b.dataset.i;const e=EXERCISES[i];const sel=document.getElementById("exday-"+i);const d=dayById(sel.value);if(!d)break;d.ex.push({id:uid(),name:e.n,sets:4,reps:"12"});persist("routine");toast(e.n+" añadido a "+d.name);break}
    case"delex":{const d=dayById(b.dataset.day);d.ex=d.ex.filter(z=>z.id!==id);persist("routine");break}
  }
  render();
});

{n:"Dominadas supinas (chin-ups)",g:"Espalda",m:"Dorsal ancho, bíceps",e:"Barra fija",s:["Agarra la barra con las palmas hacia ti, a la anchura de los hombros.","Tira hasta pasar la barbilla de la barra.","Mantén el cuerpo sin balanceos.","Baja despacio hasta estirar."],t:"Más fácil que la prona y trabaja mucho el bíceps."},
{n:"Jalón al pecho",g:"Espalda",m:"Dorsal ancho, redondo mayor, bíceps",e:"Polea alta",s:["Siéntate con los muslos bajo los rodillos y agarra la barra ancha.","Inclina el torso un poco hacia atrás y saca pecho.","Tira de la barra hasta la parte alta del pecho llevando los codos hacia abajo.","Sube controlando hasta estirar los brazos."],t:"No tires con los brazos: piensa en llevar los codos a los bolsillos."},
{n:"Jalón con agarre estrecho",g:"Espalda",m:"Dorsal ancho, bíceps",e:"Polea alta con agarre en V",s:["Siéntate y agarra el triángulo.","Tira hacia el esternón con el pecho alto.","Junta escápulas al final.","Sube despacio."],t:"Más recorrido y énfasis en la parte baja del dorsal."},
{n:"Remo con barra",g:"Espalda",m:"Dorsal ancho, romboides, trapecio, deltoides posterior, bíceps",e:"Barra",s:["De pie, inclina el torso unos 45° con la espalda recta y las rodillas algo flexionadas.","Agarra la barra a la anchura de los hombros.","Llévala hacia el ombligo juntando las escápulas.","Baja controlando sin redondear la espalda."],t:"Si se te curva la espalda, baja el peso."},
{n:"Remo gironda (remo en polea baja)",g:"Espalda",m:"Dorsal ancho, romboides, trapecio medio, bíceps",e:"Polea baja con agarre en V",s:["Siéntate con los pies en la plataforma y las rodillas algo flexionadas.","Con la espalda recta, tira del agarre hacia el abdomen.","Junta las escápulas y saca pecho al final.","Estira los brazos dejando que la espalda se alargue sin redondearse."],t:"No balancees el tronco para mover más peso."},
{n:"Remo con mancuerna a una mano",g:"Espalda",m:"Dorsal ancho, romboides, bíceps",e:"Mancuerna y banco",s:["Apoya rodilla y mano del mismo lado en el banco.","Con la otra mano sujeta la mancuerna con el brazo estirado.","Tira llevando el codo hacia la cadera.","Baja despacio hasta estirar."],t:"Mantén la espalda paralela al suelo y sin girar."},
{n:"Remo en máquina",g:"Espalda",m:"Dorsal, romboides, trapecio medio",e:"Máquina de remo",s:["Apoya el pecho en el soporte.","Agarra las asas con los brazos estirados.","Tira juntando las escápulas.","Vuelve despacio."],t:"El apoyo en el pecho protege la zona lumbar."},
{n:"Remo en T",g:"Espalda",m:"Dorsal, trapecio, romboides",e:"Barra en T o barra en esquina",s:["Colócate sobre la barra con el torso inclinado y la espalda recta.","Agarra el asa con las dos manos.","Tira hacia el pecho juntando escápulas.","Baja sin redondear."],t:"Permite cargar mucho con buena postura."},
{n:"Pull over en polea",g:"Espalda",m:"Dorsal ancho, redondo mayor",e:"Polea alta con barra o cuerda",s:["De pie frente a la polea, inclina el torso y estira los brazos al frente.","Con los codos casi rectos, baja la barra en arco hasta los muslos.","Aprieta los dorsales abajo.","Sube controlando."],t:"Aísla el dorsal sin que trabaje el bíceps."},
{n:"Pull over tumbado",g:"Espalda",m:"Dorsal ancho, pectoral, serrato",e:"Mancuerna o barra y banco",s:["Túmbate en el banco con el peso sobre el pecho.","Con los codos un poco flexionados, llévalo por detrás de la cabeza.","Baja hasta notar el estiramiento.","Vuelve tirando con los dorsales."],t:"No arquees la espalda para bajar más."},
{n:"Peso muerto",g:"Espalda",m:"Erectores espinales, glúteo, isquiotibiales, trapecio, antebrazo",e:"Barra",s:["Pies a la anchura de la cadera con la barra sobre la mitad del pie.","Baja la cadera y agarra la barra justo fuera de las piernas.","Con la espalda neutra y el pecho alto, empuja el suelo y sube la barra pegada a las piernas.","Termina de pie con la cadera estirada y baja en el orden inverso."],t:"La barra nunca se aleja de las piernas. Aprende la técnica con poco peso."},
{n:"Hiperextensiones lumbares",g:"Espalda",m:"Erectores espinales, glúteo, isquiotibiales",e:"Banco de hiperextensiones",s:["Ajusta el banco para que la cadera quede justo por encima del apoyo.","Cruza los brazos sobre el pecho.","Baja el torso flexionando la cadera.","Sube hasta alinear el cuerpo, sin pasarte hacia atrás."],t:"Puedes sujetar un disco para añadir carga."},
{n:"Encogimientos de hombros",g:"Espalda",m:"Trapecio superior",e:"Mancuernas o barra",s:["De pie con el peso a los lados o delante.","Sube los hombros hacia las orejas.","Mantén un segundo arriba.","Baja despacio."],t:"No hagas círculos con los hombros."},
{n:"Face pull",g:"Espalda",m:"Deltoides posterior, trapecio medio, manguito rotador",e:"Polea alta con cuerda",s:["Coloca la polea a la altura de la cara y agarra la cuerda con las palmas hacia dentro.","Da un paso atrás con los brazos estirados.","Tira hacia la cara separando las manos y llevando los codos altos.","Vuelve despacio."],t:"Muy bueno para la postura y la salud del hombro."},
{n:"Remo invertido",g:"Espalda",m:"Dorsal, romboides, bíceps",e:"Barra baja, Smith o TRX",s:["Cuélgate bajo una barra con el cuerpo recto y los talones en el suelo.","Tira hasta acercar el pecho a la barra.","Junta las escápulas arriba.","Baja controlando."],t:"Cuanto más horizontal el cuerpo, más difícil."},
/* ---------------- HOMBRO ---------------- */
{n:"Press militar con barra",g:"Hombro",m:"Deltoides anterior y medio, tríceps",e:"Barra",s:["De pie, barra apoyada en la parte alta del pecho y agarre algo más ancho que los hombros.","Aprieta glúteos y abdomen.","Empuja la barra en vertical apartando un poco la cabeza.","Baja controlando hasta la clavícula."],t:"No arquees la zona lumbar para empujar."},
{n:"Press de hombro con mancuernas",g:"Hombro",m:"Deltoides anterior y medio, tríceps",e:"Mancuernas y banco con respaldo",s:["Siéntate con el respaldo vertical y las mancuernas a la altura de las orejas.","Empuja hacia arriba hasta casi estirar.","Baja hasta que los codos queden a la altura de los hombros.","Repite sin despegar la espalda."],t:"Puedes hacerlo de pie para implicar más el core."},
{n:"Press Arnold",g:"Hombro",m:"Deltoides anterior, medio y tríceps",e:"Mancuernas",s:["Empieza con las mancuernas delante de la cara y las palmas hacia ti.","Mientras empujas hacia arriba, gira las palmas hacia delante.","Termina con los brazos estirados.","Baja deshaciendo el giro."],t:"Recorre más ángulos del hombro que el press normal."},
{n:"Press de hombro en máquina",g:"Hombro",m:"Deltoides anterior y medio, tríceps",e:"Máquina",s:["Ajusta el asiento para que las asas queden a la altura de los hombros.","Empuja hacia arriba.","Baja despacio.","Mantén la espalda apoyada."],t:"Opción segura para principiantes."},
{n:"Elevaciones laterales",g:"Hombro",m:"Deltoides medio",e:"Mancuernas",s:["De pie, mancuernas a los lados y codos ligeramente flexionados.","Eleva los brazos hacia los lados hasta la altura de los hombros.","Piensa en llevar los codos, no las manos.","Baja despacio."],t:"Poco peso y sin balancearte: es un músculo pequeño."},
{n:"Elevaciones laterales en polea",g:"Hombro",m:"Deltoides medio",e:"Polea baja",s:["Colócate de lado a la polea y agarra el asa con la mano contraria.","Eleva el brazo hacia el lado hasta la altura del hombro.","Mantén un segundo.","Baja controlando."],t:"La polea mantiene la tensión en todo el recorrido."},
{n:"Elevaciones frontales",g:"Hombro",m:"Deltoides anterior",e:"Mancuernas, disco o polea",s:["De pie con el peso delante de los muslos.","Eleva los brazos al frente hasta la altura de los ojos.","Codos ligeramente flexionados.","Baja despacio."],t:"El deltoides anterior ya trabaja mucho en los press; no abuses."},
{n:"Pájaros (hombro posterior)",g:"Hombro",m:"Deltoides posterior, romboides",e:"Mancuernas",s:["Inclina el torso casi paralelo al suelo con la espalda recta.","Deja colgar las mancuernas con los codos un poco flexionados.","Abre los brazos hacia los lados juntando escápulas.","Baja despacio."],t:"También puedes hacerlo tumbado boca abajo en un banco inclinado."},
{n:"Contractora inversa (hombro posterior)",g:"Hombro",m:"Deltoides posterior",e:"Máquina contractora",s:["Siéntate mirando al respaldo de la máquina.","Agarra las asas con los brazos estirados al frente.","Abre los brazos hacia atrás.","Vuelve despacio."],t:"La forma más cómoda de aislar el hombro posterior."},
{n:"Remo al mentón",g:"Hombro",m:"Deltoides medio, trapecio",e:"Barra, barra Z o polea",s:["De pie, agarra la barra con las manos algo más separadas que los hombros.","Sube la barra pegada al cuerpo llevando los codos hacia arriba y afuera.","Para cuando los codos lleguen a la altura de los hombros.","Baja despacio."],t:"Agarre ancho y sin pasar de los hombros para no pinzar."},
{n:"Rotación externa con polea",g:"Hombro",m:"Manguito rotador (infraespinoso, redondo menor)",e:"Polea o goma",s:["De lado a la polea, codo pegado al costado a 90°.","Gira el antebrazo hacia fuera sin separar el codo.","Vuelve despacio.","Haz las mismas repeticiones con cada brazo."],t:"Ejercicio de prevención; usa muy poco peso."},
/* ---------------- BÍCEPS ---------------- */
{n:"Curl de bíceps con barra",g:"Bíceps",m:"Bíceps braquial, braquial",e:"Barra recta o Z",s:["De pie con la barra agarrada en supinación a la anchura de los hombros.","Codos pegados al cuerpo.","Flexiona los codos subiendo la barra hasta los hombros.","Baja despacio hasta estirar."],t:"La barra Z es más cómoda para las muñecas."},
{n:"Curl de bíceps con mancuernas",g:"Bíceps",m:"Bíceps braquial",e:"Mancuernas",s:["De pie o sentado con las mancuernas a los lados.","Sube girando la palma hacia arriba.","Aprieta arriba.","Baja despacio, alternando o a la vez."],t:"No balancees el cuerpo."},
{n:"Curl martillo",g:"Bíceps",m:"Braquiorradial, braquial, bíceps",e:"Mancuernas",s:["Mancuernas a los lados con las palmas enfrentadas.","Sube manteniendo el agarre neutro.","Codos quietos.","Baja controlando."],t:"Engrosa el brazo y fortalece el antebrazo."},
{n:"Curl predicador (banco Scott)",g:"Bíceps",m:"Bíceps (porción corta), braquial",e:"Banco Scott con barra Z o mancuerna",s:["Apoya los brazos en el cojín del banco.","Sube el peso flexionando los codos.","Baja hasta casi estirar.","No despegues los brazos del cojín."],t:"Evita estirar del todo con mucho peso."},
{n:"Curl concentrado",g:"Bíceps",m:"Bíceps braquial",e:"Mancuerna",s:["Sentado, apoya el codo en la cara interna del muslo.","Sube la mancuerna hacia el hombro.","Aprieta arriba.","Baja despacio."],t:"Movimiento estricto y muy aislado."},
{n:"Curl en polea",g:"Bíceps",m:"Bíceps braquial",e:"Polea baja con barra o cuerda",s:["De pie frente a la polea baja.","Codos pegados al cuerpo.","Flexiona los codos hasta los hombros.","Baja manteniendo la tensión."],t:"Tensión constante en todo el recorrido."},
{n:"Curl inclinado con mancuernas",g:"Bíceps",m:"Bíceps (porción larga)",e:"Mancuernas y banco inclinado",s:["Siéntate en un banco a 45° con los brazos colgando.","Sube las mancuernas sin adelantar los codos.","Aprieta arriba.","Baja hasta estirar."],t:"Estira mucho el bíceps; usa menos peso."},
{n:"Curl araña",g:"Bíceps",m:"Bíceps (porción corta)",e:"Barra Z o mancuernas y banco inclinado",s:["Túmbate boca abajo en un banco inclinado con los brazos colgando.","Sube el peso flexionando los codos.","Aprieta arriba.","Baja despacio."],t:"Elimina cualquier trampa con el cuerpo."},
/* ---------------- TRÍCEPS ---------------- */
{n:"Extensión de tríceps en polea",g:"Tríceps",m:"Tríceps braquial",e:"Polea alta con barra o cuerda",s:["De pie frente a la polea, codos pegados al cuerpo.","Empuja hacia abajo hasta estirar los brazos.","Con cuerda, separa las manos al final.","Sube hasta que los antebrazos queden paralelos al suelo."],t:"Solo se mueven los antebrazos."},
{n:"Press francés",g:"Tríceps",m:"Tríceps (las tres cabezas)",e:"Barra Z y banco",s:["Túmbate con la barra sobre la frente y los brazos estirados.","Flexiona los codos bajando la barra hacia la frente o por detrás de la cabeza.","Codos apuntando al techo.","Estira los brazos."],t:"Baja despacio y con peso moderado."},
{n:"Extensión de tríceps por encima de la cabeza",g:"Tríceps",m:"Tríceps (cabeza larga)",e:"Mancuerna o polea",s:["Sujeta una mancuerna con las dos manos por encima de la cabeza.","Baja por detrás de la cabeza flexionando los codos.","Codos cerca de la cabeza.","Estira hacia arriba."],t:"Estira mucho la cabeza larga del tríceps."},
{n:"Patada de tríceps",g:"Tríceps",m:"Tríceps braquial",e:"Mancuerna o polea",s:["Inclina el torso con la mano libre apoyada en un banco.","Codo pegado al cuerpo a 90°.","Estira el brazo hacia atrás.","Vuelve despacio."],t:"Aprieta un segundo con el brazo estirado."},
{n:"Fondos de tríceps en banco",g:"Tríceps",m:"Tríceps, deltoides anterior",e:"Banco",s:["Apoya las manos en el borde del banco detrás de ti y los pies delante.","Baja flexionando los codos hacia atrás hasta 90°.","Mantén la espalda cerca del banco.","Empuja hasta estirar."],t:"Con las rodillas flexionadas es más fácil."},
{n:"Fondos de tríceps en paralelas",g:"Tríceps",m:"Tríceps, pectoral, deltoides anterior",e:"Paralelas o máquina de fondos",s:["Sujétate en las paralelas con el cuerpo vertical.","Baja flexionando los codos pegados al cuerpo.","Para a unos 90°.","Empuja hasta arriba."],t:"El torso vertical carga más el tríceps que el pecho."},
{n:"Press de banca agarre estrecho",g:"Tríceps",m:"Tríceps, pectoral",e:"Barra y banco",s:["Agarra la barra a la anchura de los hombros.","Baja hasta la parte baja del pecho con los codos pegados.","Empuja hacia arriba.","Mantén las muñecas rectas."],t:"Permite mover mucho peso con el tríceps."},
{n:"Flexiones diamante",g:"Tríceps",m:"Tríceps, pectoral",e:"Peso corporal",s:["Junta las manos bajo el pecho formando un rombo con pulgares e índices.","Cuerpo recto.","Baja con los codos pegados.","Empuja hasta arriba."],t:"Muy exigentes; empieza con rodillas apoyadas."},
/* ---------------- ANTEBRAZO ---------------- */
{n:"Curl de muñeca",g:"Antebrazo",m:"Flexores del antebrazo",e:"Barra o mancuernas",s:["Sentado, apoya los antebrazos en los muslos con las palmas hacia arriba.","Deja caer la barra hacia los dedos.","Flexiona las muñecas hacia arriba.","Baja despacio."],t:"Recorrido corto y repeticiones altas."},
{n:"Curl de muñeca invertido",g:"Antebrazo",m:"Extensores del antebrazo",e:"Barra o mancuernas",s:["Antebrazos en los muslos con las palmas hacia abajo.","Sube el dorso de la mano.","Baja despacio.","Repite."],t:"Ayuda a prevenir el codo de tenista."},
{n:"Curl invertido",g:"Antebrazo",m:"Braquiorradial, extensores",e:"Barra Z",s:["Agarra la barra con las palmas hacia abajo.","Sube como en un curl normal.","Codos pegados.","Baja despacio."],t:"Fortalece el agarre para remos y dominadas."},
{n:"Colgarse de la barra",g:"Antebrazo",m:"Flexores del antebrazo, agarre",e:"Barra fija",s:["Cuélgate de una barra con agarre firme.","Mantén los hombros activos, sin hundirte.","Aguanta el máximo tiempo.","Descansa y repite."],t:"Mejora el agarre y descomprime la espalda."},
/* ---------------- CUÁDRICEPS ---------------- */
{n:"Sentadilla con barra",g:"Cuádriceps",m:"Cuádriceps, glúteo, aductores, core",e:"Barra y rack",s:["Barra sobre los trapecios, pies a la anchura de los hombros y puntas un poco hacia fuera.","Toma aire y aprieta el abdomen.","Baja llevando la cadera atrás y abajo, rodillas en la dirección de los pies.","Baja hasta que el muslo quede al menos paralelo y sube empujando el suelo."],t:"Talones en el suelo y espalda neutra en todo momento."},
{n:"Sentadilla frontal",g:"Cuádriceps",m:"Cuádriceps, core, glúteo",e:"Barra",s:["Apoya la barra en la parte delantera de los hombros con los codos altos.","Baja con el torso muy vertical.","Llega a la profundidad que te permita mantener los codos arriba.","Sube empujando con todo el pie."],t:"Carga más el cuádriceps y menos la zona lumbar."},
{n:"Sentadilla goblet",g:"Cuádriceps",m:"Cuádriceps, glúteo, core",e:"Mancuerna o kettlebell",s:["Sujeta una mancuerna en vertical pegada al pecho.","Baja con el torso erguido abriendo las rodillas.","Los codos pueden rozar el interior de las rodillas.","Sube empujando el suelo."],t:"Perfecta para aprender a hacer sentadillas."},
{n:"Sentadilla en Smith",g:"Cuádriceps",m:"Cuádriceps, glúteo",e:"Máquina Smith",s:["Coloca la barra sobre los trapecios y los pies un poco por delante.","Desbloquea la barra.","Baja controlando hasta el paralelo.","Sube y bloquea al terminar."],t:"La guía permite centrarse en la pierna."},
{n:"Sentadilla hack",g:"Cuádriceps",m:"Cuádriceps, glúteo",e:"Máquina hack",s:["Apoya espalda y hombros en la máquina con los pies en la plataforma.","Desbloquea los seguros.","Baja flexionando rodillas y cadera.","Empuja hasta casi estirar."],t:"Pies más bajos en la plataforma = más cuádriceps."},
{n:"Prensa de piernas",g:"Cuádriceps",m:"Cuádriceps, glúteo, isquiotibiales",e:"Máquina de prensa",s:["Siéntate con la espalda apoyada y los pies a la anchura de la cadera en la plataforma.","Quita los seguros.","Baja la plataforma flexionando las rodillas hasta unos 90°.","Empuja sin bloquear las rodillas arriba."],t:"No dejes que la zona lumbar se despegue del respaldo."},
{n:"Extensión de cuádriceps",g:"Cuádriceps",m:"Cuádriceps",e:"Máquina de extensiones",s:["Siéntate con la espalda apoyada y el rodillo sobre los tobillos.","Alinea la rodilla con el eje de la máquina.","Estira las piernas por completo y aprieta un segundo.","Baja despacio."],t:"Ideal como acabado o para calentar la rodilla."},
{n:"Zancadas",g:"Cuádriceps",m:"Cuádriceps, glúteo, isquiotibiales",e:"Mancuernas o peso corporal",s:["De pie con las mancuernas a los lados.","Da un paso largo al frente.","Baja hasta que la rodilla de atrás casi toque el suelo.","Empuja con la pierna delantera para volver o avanzar."],t:"Paso largo para más glúteo, corto para más cuádriceps."},
{n:"Sentadilla búlgara",g:"Cuádriceps",m:"Cuádriceps, glúteo",e:"Mancuernas y banco",s:["Apoya el empeine del pie de atrás en un banco.","Coloca el pie delantero un paso largo por delante.","Baja en vertical hasta que el muslo delantero quede paralelo.","Sube empujando con la pierna delantera."],t:"Muy exigente; empieza sin peso."},
{n:"Subida al cajón",g:"Cuádriceps",m:"Cuádriceps, glúteo",e:"Cajón o banco y mancuernas",s:["Frente a un cajón a la altura de la rodilla.","Apoya un pie entero encima.","Sube empujando con esa pierna sin impulsarte con la de abajo.","Baja controlando y repite."],t:"Cuanto más alto el cajón, más glúteo."},
{n:"Sentadilla sissy",g:"Cuádriceps",m:"Cuádriceps (recto femoral)",e:"Peso corporal o soporte",s:["Sujétate a algo estable.","Ponte de puntillas e inclina el cuerpo hacia atrás.","Baja llevando las rodillas hacia delante.","Sube manteniendo cadera y tronco alineados."],t:"Avanzado; muy duro para las rodillas si no estás acostumbrado."},
{n:"Sentadilla isométrica en pared",g:"Cuádriceps",m:"Cuádriceps",e:"Pared",s:["Apoya la espalda en la pared.","Baja hasta que los muslos queden paralelos al suelo.","Rodillas sobre los tobillos.","Aguanta el tiempo marcado."],t:"Mide el tiempo en vez de repeticiones."},
/* ---------------- FEMORAL ---------------- */
{n:"Peso muerto rumano",g:"Femoral",m:"Isquiotibiales, glúteo, lumbares",e:"Barra o mancuernas",s:["De pie con la barra delante de los muslos y rodillas un poco flexionadas.","Lleva la cadera hacia atrás bajando la barra pegada a las piernas.","Baja hasta notar el estiramiento detrás de los muslos.","Sube empujando la cadera hacia delante."],t:"La espalda recta manda; no persigas bajar más."},
{n:"Peso muerto con piernas rígidas",g:"Femoral",m:"Isquiotibiales, lumbares, glúteo",e:"Barra o mancuernas",s:["De pie con las piernas casi rectas.","Baja el peso flexionando la cadera con la espalda neutra.","Para cuando notes el estiramiento.","Sube despacio."],t:"Más estiramiento que el rumano; usa menos peso."},
{n:"Curl femoral tumbado",g:"Femoral",m:"Isquiotibiales",e:"Máquina de curl tumbado",s:["Túmbate boca abajo con el rodillo detrás de los tobillos.","Rodillas justo por debajo del banco.","Flexiona las piernas llevando los talones al glúteo.","Baja despacio sin despegar la cadera."],t:"Es la «flexión de rodilla» tumbado."},
{n:"Curl femoral sentado",g:"Femoral",m:"Isquiotibiales",e:"Máquina de curl sentado",s:["Siéntate con el rodillo sobre la parte baja de las pantorrillas y el muslo sujeto.","Flexiona las rodillas llevando los pies hacia abajo y atrás.","Aprieta un segundo.","Vuelve despacio."],t:"Al estar sentado el femoral se estira más."},
{n:"Curl femoral de pie",g:"Femoral",m:"Isquiotibiales",e:"Máquina o polea con tobillera",s:["De pie, apoya el rodillo detrás del tobillo de una pierna.","Flexiona la rodilla llevando el talón al glúteo.","Mantén la cadera quieta.","Baja despacio y cambia de pierna."],t:"Trabaja cada pierna por separado."},
{n:"Curl nórdico",g:"Femoral",m:"Isquiotibiales",e:"Peso corporal y algo para sujetar los tobillos",s:["De rodillas con los tobillos sujetos.","Inclínate hacia delante con el cuerpo recto desde las rodillas.","Baja lo más despacio que puedas.","Frena con las manos y vuelve ayudándote."],t:"Muy avanzado y muy eficaz para prevenir lesiones."},
{n:"Buenos días",g:"Femoral",m:"Isquiotibiales, lumbares, glúteo",e:"Barra",s:["Barra sobre los trapecios y rodillas un poco flexionadas.","Inclina el torso hacia delante llevando la cadera atrás.","Para cuando el torso esté casi paralelo o notes el estiramiento.","Vuelve arriba."],t:"Empieza con muy poco peso."},
/* ---------------- GLÚTEO ---------------- */
{n:"Hip thrust",g:"Glúteo",m:"Glúteo mayor, isquiotibiales",e:"Barra y banco",s:["Apoya la parte alta de la espalda en un banco y la barra sobre la cadera (con protector).","Pies a la anchura de la cadera, rodillas a 90° arriba.","Sube la cadera apretando los glúteos hasta alinear tronco y muslos.","Baja controlando sin tocar el suelo."],t:"Mete la barbilla y mira al frente para no arquear la lumbar."},

const EX_GROUPS=["Pecho","Espalda","Hombro","Bíceps","Tríceps","Antebrazo","Cuádriceps","Femoral","Glúteo","Gemelo","Abdomen","Lumbar","Cardio y funcional","Cuerpo completo"];
const EX_META={"Pierna (todo)":["Cuádriceps","Femoral","Glúteo","Gemelo"],"Brazos (todo)":["Bíceps","Tríceps","Antebrazo"],"Core (todo)":["Abdomen","Lumbar"]};
const norm=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const EXQ={q:"",g:"",open:null};
function inRoutine(name){const n=norm(name);const out=[];for(const d of S.routine.days)for(const x of d.ex){const xn=norm(x.name);if(xn&&(xn===n||xn.startsWith(n+" ")))out.push(d.name)}return [...new Set(out)]}
function hl(text,q){const t=esc(text);if(!q)return t;const nt=norm(text);const i=nt.indexOf(q);if(i<0)return t;const raw=String(text);return esc(raw.slice(0,i))+"<mark>"+esc(raw.slice(i,i+q.length))+"</mark>"+esc(raw.slice(i+q.length))}
function vEjercicios(){
  const q=norm(EXQ.q.trim());
  const groups=EXQ.g?(EX_META[EXQ.g]||[EXQ.g]):null;
  const list=EXERCISES.filter(e=>(!groups||groups.includes(e.g))&&(!q||[e.n,e.m,e.g,e.e].some(f=>norm(f).includes(q))));
  const cnt=g=>EXERCISES.filter(e=>(EX_META[g]||[g]).includes(e.g)).length;
  let h=`<span class="eyebrow">Biblioteca</span><h2 class="sec" style="margin-bottom:12px">Ejercicios</h2>
  <div class="exbar"><input class="txt" id="exq" type="search" placeholder="Busca por nombre o músculo: glúteo, remo…" value="${esc(EXQ.q)}" aria-label="Buscar ejercicios" autocomplete="off">
  <select class="sel" id="exgroup" aria-label="Parte del cuerpo"><option value="">Todas las partes del cuerpo (${EXERCISES.length})</option><optgroup label="Zonas">${Object.keys(EX_META).map(g=>`<option value="${g}" ${EXQ.g===g?"selected":""}>${g} (${cnt(g)})</option>`).join("")}</optgroup><optgroup label="Músculos">${EX_GROUPS.map(g=>`<option value="${g}" ${EXQ.g===g?"selected":""}>${g} (${cnt(g)})</option>`).join("")}</optgroup></select></div>
  <p class="hint" style="margin:0 0 10px">${list.length} ejercicio${list.length===1?"":"s"}${EXQ.g||q?` · <button class="btn small ghost" data-act="exclear" style="padding:0 4px">Quitar filtros</button>`:""}</p>`;
  if(!list.length)return h+`<div class="card empty">No hay ejercicios con «${esc(EXQ.q)}»${EXQ.g?" en "+esc(EXQ.g):""}. Prueba con otro nombre o músculo.</div>`;
  h+=`<div class="exlist">${list.map(e=>{const i=EXERCISES.indexOf(e);const open=EXQ.open===i;const inr=inRoutine(e.n);
    return `<div class="excard"><button data-act="exopen" data-i="${i}" aria-expanded="${open}"><span style="min-width:0"><b>${hl(e.n,q)}</b><span class="hint">${hl(e.m,q)}</span>${inr.length?`<span class="inr">✓ En tu rutina: ${esc(inr.join(", "))}</span>`:""}</span><span class="gtag">${esc(e.g)}</span></button>
    ${open?`<div class="exbody"><div class="exmeta"><span>Material: <b>${esc(e.e)}</b></span></div><ol>${e.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ol><div class="tip"><b>Consejo:</b> ${esc(e.t)}</div>
    ${S.routine.days.length?`<div class="exadd"><select class="sel" id="exday-${i}" aria-label="Día de la rutina">${S.routine.days.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join("")}</select><button class="btn primary" data-act="exadd" data-i="${i}">Añadir</button></div>`:""}</div>`:""}</div>`}).join("")}</div>`;
  return h;
}
document.addEventListener("input",e=>{if(e.target.id==="exq"){EXQ.q=e.target.value;EXQ.open=null;const pos=e.target.selectionStart;render();const i=$("#exq");if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(_){}}}});

let reloading=false;
async function reloadData(){
  if(reloading)return;reloading=true;$("#reload").classList.add("spin");
  try{
    await flushWrites();
    if(SERVER){const {docs}=await api("GET","/api/docs");adopt(docs.map(d=>({id:d.key,data:d.data})));if(ui.tab==="admin")await loadAdmin();toast("Datos actualizados")}
    else if(store&&store.col){const snap=await store.col.get();adopt(snap.docs.map(d=>({id:d.id,data:d.data()})));toast("Datos actualizados")}
    else location.reload();
  }catch(err){toast(err.status===401?"Tu sesión ha caducado":"No se pudo recargar. Revisa la conexión.");if(err.status===401)showAuth()}
  finally{reloading=false;$("#reload").classList.remove("spin")}
}

/* Actualización automática: si hay una versión nueva en el servidor, la app se recarga sola */
let BUILD0=null;
async function checkUpdate(){
  if(!document.documentElement.dataset.mode)return;
  try{const r=await fetch("/api/version?t="+Date.now(),{cache:"no-store"});const {build}=await r.json();
    if(BUILD0===null){BUILD0=build;return}
    if(build!==BUILD0){if(store&&typeof flushWrites==="function")await flushWrites();location.reload()}
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate()});
setInterval(checkUpdate,5*60*1000);

render();

/* ---------- guardado en la cuenta ---------- */
function fromDocs(docs){
  const next={profiles:[{id:"main",name:"Yo",color:COLORS[0]}],active:ALL.active,data:{main:{routine:{days:[]},logs:{}}}};
  for(const {id,data:v} of docs){if(!v)continue;
    if(id==="profiles"){if(Array.isArray(v.list)&&v.list.length)next.profiles=JSON.parse(JSON.stringify(v.list));continue}
    let pid="main",k=id;const t=id.indexOf("~");if(t>0){pid=id.slice(0,t);k=id.slice(t+1)}
    const D=next.data[pid]||(next.data[pid]={routine:{days:[]},logs:{}});
    if(k==="routine")D.routine.days=JSON.parse(JSON.stringify(v.days||[]));else if(k.startsWith("log-"))D.logs[k.slice(4)]=JSON.parse(JSON.stringify(v));
  }
  next.profiles.forEach(p=>{if(!next.data[p.id])next.data[p.id]={routine:{days:[]},logs:{}}});
  if(!next.profiles.find(p=>p.id===next.active))next.active=next.profiles[0].id;
  return next;
}
async function pushAll(){for(const p of ALL.profiles){const D=ALL.data[p.id];if(!D)continue;await store.ref(keyFor(p.id,"routine")).set({days:D.routine.days});for(const d in D.logs)await store.ref(keyFor(p.id,"log-"+d)).set(D.logs[d])}if(ALL.profiles.length>1||ALL.profiles[0].name!=="Yo")await store.ref("profiles").set({list:ALL.profiles})}
async function api(method,url,body){const r=await fetch(url,{method,headers:body?{"content-type":"application/json"}:{},body:body?JSON.stringify(body):undefined,credentials:"same-origin"});let j=null;try{j=await r.json()}catch(e){}if(!r.ok){const err=new Error(j&&j.error||"Error "+r.status);err.status=r.status;throw err}return j}
function adopt(docs){
  if(docs.length){ALL=fromDocs(docs);S=ALL.data[ALL.active];saveLocal();selDay=null;ui.progEx=null}
  render();setSync(true);
}

function vAuth(mode,err){
  return `<div class="auth"><svg width="64" height="64" viewBox="0 0 72 72" aria-hidden="true"><rect width="72" height="72" rx="16" fill="#0F6E56"/><rect x="10" y="30" width="52" height="4" rx="2" fill="#E1F5EE"/><rect x="14" y="20" width="7" height="24" rx="2" fill="#5DCAA5"/><rect x="51" y="20" width="7" height="24" rx="2" fill="#5DCAA5"/><rect x="21" y="24" width="4" height="16" rx="1.5" fill="#9FE1CB"/><rect x="47" y="24" width="4" height="16" rx="1.5" fill="#9FE1CB"/><rect x="18" y="52" width="36" height="3" rx="1.5" fill="#9FE1CB"/><rect x="18" y="58" width="22" height="3" rx="1.5" fill="#5DCAA5"/></svg>
  <h2 class="sec">${mode==="login"?"Entra en Liftlog":"Crea tu cuenta"}</h2><p class="hint">${mode==="login"?"Tu rutina y tus marcas te esperan.":"Cada persona tiene su propia rutina, calendario y progreso."}</p>
  <form id="authform" class="stack" novalidate>
  ${mode==="register"?`<label class="lab">Nombre<input class="txt" id="a-name" autocomplete="name" placeholder="Tu nombre"></label>`:""}
  ${mode==="register"?`<label class="lab">Email<input class="txt" id="a-email" type="email" autocomplete="email" autocapitalize="none" placeholder="tu@email.com"></label>`:""}
  <label class="lab">${mode==="login"?"Usuario o email":"Usuario"}<input class="txt" id="a-user" autocomplete="username" autocapitalize="none" placeholder="${mode==="login"?"usuario o correo@ejemplo.com":"nombre.usuario"}"></label>
  <label class="lab">Contraseña${pwField("a-pass",mode==="login"?"current-password":"new-password",mode==="login"?"":"Mínimo 6 caracteres")}</label>
  ${err?`<p class="err" role="alert">${esc(err)}</p>`:""}
  <button class="btn primary" type="submit">${mode==="login"?"Entrar":"Crear cuenta"}</button>
  <button class="btn ghost" type="button" data-auth="${mode==="login"?"register":"login"}">${mode==="login"?"¿No tienes cuenta? Créala":"Ya tengo cuenta"}</button></form></div>`;
}
function showAuth(err){document.body.classList.add("locked");$("#view").innerHTML=vAuth(authMode,err)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-auth]");if(b){authMode=b.dataset.auth;showAuth()}});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="authform")return;e.preventDefault();
  const u=$("#a-user").value.trim().toLowerCase(),pw=$("#a-pass").value,nm=$("#a-name")?.value.trim(),em=$("#a-email")?.value.trim();
  if(!u||!pw||(authMode==="register"&&!nm))return showAuth("Rellena todos los campos.");
  try{const r=await api("POST","/api/"+authMode,{username:u,password:pw,name:nm,email:em});await startServer(r.user,authMode==="register")}catch(err){showAuth(err.message)}
});
async function startServer(user,fresh){
  SERVER={user};document.body.classList.remove("locked");
  store={ref:k=>({set:d=>api("PUT","/api/docs/"+encodeURIComponent(k),d),delete:()=>api("DELETE","/api/docs/"+encodeURIComponent(k))})};
  const {docs}=await api("GET","/api/docs");
  if(!docs.length){
    ALL={profiles:[{id:"main",name:user.name,color:COLORS[0]}],active:"main",data:{main:defaults(false)}};S=ALL.data.main;
    await pushAll();selDay=null;ui.tab=fresh?"rutina":"entreno";render();setSync(true);if(fresh)toast("Cuenta creada. Monta tu rutina");
  }else{ui.tab="entreno";adopt(docs.map(d=>({id:d.key,data:d.data})))}
}
async function logout(){try{await api("POST","/api/logout")}catch(e){}SERVER=null;store=null;try{localStorage.removeItem(LS_KEY2)}catch(e){}authMode="login";showAuth()}

/* ---------- contraseñas con ojo ---------- */

const EYE_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.5 6.6C3.8 8.3 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 4.4-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
const pwField=(id,ac,ph="")=>`<span class="pwfield"><input class="txt" id="${id}" type="password" autocomplete="${ac}" placeholder="${ph}" autocapitalize="none" spellcheck="false"><button type="button" class="eye" data-eye="${id}" aria-label="Mostrar contraseña" aria-pressed="false">${EYE}</button></span>`;

/* ---------- panel de administración ---------- */
let ADM=null,DET=null;
const A={view:"resumen",q:"",filter:"todos",sort:"recientes",userId:null,creating:false,confirm:null,err:null};
async function loadAdmin(){try{ADM=await api("GET","/api/admin/overview");ADM.err=null}catch(e){ADM={err:e.message}}if(ui.tab==="admin")render()}
async function loadDetail(id){DET=null;render();try{DET=await api("GET","/api/admin/users/"+id)}catch(e){DET={err:e.message}}if(ui.tab==="admin"&&A.view==="user")render()}
const ago=t=>{if(!t)return"nunca";const d=Math.floor((Date.now()-new Date(t))/86400000);return d<=0?"hoy":d===1?"ayer":d<30?"hace "+d+" días":d<365?"hace "+Math.round(d/30)+" meses":"hace más de un año"};
const fmtN=n=>Math.round(n||0).toLocaleString("es-ES");
const tons=v=>v>=1000?fmtKg(Math.round(v/100)/10)+" t":fmtN(v)+" kg";
const dayOf=t=>String(t||"").slice(0,10);
function admUsers(){
  const q=A.q.trim().toLowerCase();const now=Date.now();
  let L=ADM.users.filter(u=>!q||[u.name,u.username,u.email].some(x=>String(x||"").toLowerCase().includes(q)));
  const act=u=>u.lastActivity&&now-new Date(u.lastActivity)<30*86400000;
  if(A.filter==="admins")L=L.filter(u=>u.isAdmin);else if(A.filter==="activos")L=L.filter(act);else if(A.filter==="inactivos")L=L.filter(u=>!act(u));
  const by={recientes:(a,b)=>new Date(b.createdAt)-new Date(a.createdAt),actividad:(a,b)=>new Date(b.lastActivity||0)-new Date(a.lastActivity||0),nombre:(a,b)=>a.name.localeCompare(b.name,"es"),entrenos:(a,b)=>b.workouts-a.workouts};
  return L.sort(by[A.sort]);
}
function barChart(daily){
  const W=340,H=130,L=24,B=20,T=8,R=4;const max=Math.max(2,...daily.map(d=>d.n));const step=max<=4?1:Math.ceil(max/4);const top=Math.ceil(max/step)*step;
  const bw=(W-L-R)/daily.length;const y=v=>T+(H-T-B)*(1-v/top);
  let g="";for(let v=0;v<=top;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="Figtree,sans-serif">${v}</text>`;
  const bars=daily.map((d,i)=>d.n?`<rect x="${(L+i*bw+1.5).toFixed(1)}" y="${y(d.n).toFixed(1)}" width="${Math.max(2,bw-3).toFixed(1)}" height="${(H-B-y(d.n)).toFixed(1)}" rx="2" fill="var(--accent)"><title>${shortDate(d.date)}: ${d.n} entreno${d.n===1?"":"s"}</title></rect>`:"").join("");
  const lab=[0,Math.floor(daily.length/2),daily.length-1].map(i=>`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-5}" text-anchor="${i===0?"start":i===daily.length-1?"end":"middle"}" font-size="10" fill="var(--muted)" font-family="Figtree,sans-serif">${shortDate(daily[i].date)}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entrenos por día en los últimos 30 días">${g}${bars}${lab}</svg>`;
}
const userLine=u=>`<button class="urow" data-act="admopen" data-id="${u.id}"><span class="avatar" style="background:${u.isAdmin?COLORS[0]:COLORS[3]}">${initials(u.name)}</span><span class="uinfo"><b>${esc(u.name)}</b>${u.isAdmin?` <span class="badge pr">Admin</span>`:""}<span class="hint">@${esc(u.username)} · ${ago(u.lastActivity)}</span></span><span class="unum"><b>${u.workouts}</b><span class="hint">entrenos</span></span></button>`;
function vAdmin(){
  let h=`<div class="adm-top"><button class="btn small ghost" data-act="profiles" style="padding-left:0">← Tu cuenta</button><button class="btn small ghost" data-act="admreload" aria-label="Actualizar datos">Actualizar</button></div><span class="eyebrow">Superadmin</span><h2 class="sec" style="margin-bottom:12px">Panel de administración</h2>`;
