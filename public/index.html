/* ================= SOBRECARGA PROGRESIVA ================= */
function repRange(r){const m=String(r||"").match(/(\d+)\s*[-–a]\s*(\d+)/);if(m)return[+m[1],+m[2]];const n=parseInt(r,10);return isNaN(n)?[8,12]:[n,n]}
function roundW(w){return Math.round(w*2)/2}
function suggestion(x,prev){
  if(!prev||!prev.sets.length)return null;
  const [lo,hi]=repRange(x.reps);const top=topOf(prev.sets);const atTop=prev.sets.filter(s=>num(s.w)===top.w);
  const allHit=atTop.every(s=>num(s.r)>=hi)&&prev.sets.length>=Math.min(+x.sets||1,prev.sets.length);
  if(allHit){const inc=top.w<10?1:top.w<40?2.5:5;return{w:roundW(top.w+inc),r:lo,why:`Completaste ${hi} repeticiones con ${fmtKg(top.w)} kg: sube el peso.`}}
  const minR=Math.min(...atTop.map(s=>num(s.r)));
  if(minR<lo&&atTop.length>1)return{w:top.w,r:Math.min(hi,minR+1),why:`Mismo peso: intenta una repetición más que la última vez.`};
  return{w:top.w,r:Math.min(hi,Math.max(lo,top.r+1)),why:`Mismo peso y una repetición más hasta llegar a ${hi}.`};
}
function sugHTML(x,prev){const s=suggestion(x,prev);if(!s)return"";
  return `<div class="sug"><div><span class="eyebrow" style="color:var(--accent)">Hoy prueba</span><b>${fmtKg(s.w)} kg × ${s.r}</b><span class="hint">${esc(s.why)}</span></div><button class="btn small" data-act="sugfill" data-id="${x.id}" data-w="${s.w}" data-r="${s.r}">Usar</button></div>`}

  return WZ_SPLITS[n].map(([name,plan],i)=>({id:uid(),name,wd:[WZ_DAYS[n][i]],ex:plan.flatMap(([g,c])=>{

    return pool.slice(0,c).map(e=>{used.add(e.n);return{id:uid(),name:e.n,sets,reps}})})}));
}

function allRecords(){
  const idx=exIndex();const recs={};let prCount=0;const best={};
  for(const d of sortedDates()){const L=S.logs[d];for(const id in L.entries||{}){const sets=validSets(L.entries[id].sets);if(!sets.length)continue;const t=topOf(sets);const rm=Math.max(...sets.map(s=>e1rm(num(s.w),num(s.r))));
    if(best[id]!==undefined&&t.w>best[id])prCount++;best[id]=Math.max(best[id]??-1,t.w);

function weekTotals(from,to){let w=0,s=0,v=0,prs=0;const best={};
  for(const d of sortedDates()){const L=S.logs[d];let any=false;for(const id in L.entries||{}){const sets=validSets(L.entries[id].sets);if(!sets.length)continue;const t=topOf(sets);
    if(d>=from&&d<=to){any=true;s+=sets.length;sets.forEach(x=>v+=num(x.w)*num(x.r));if(best[id]!==undefined&&t.w>best[id])prs++}best[id]=Math.max(best[id]??-1,t.w)}
    if(any)w++}
  return {w,s,v:Math.round(v),prs}}

function achievements(){

  const A=[

function lineChart(pts,unit){

function exportCSV(){
  const rows=[["Fecha","Rutina","Ejercicio","Serie","Kg","Repeticiones","Volumen (kg)"]];
  for(const d of sortedDates()){const L=S.logs[d];for(const id in L.entries||{}){const e=L.entries[id];validSets(e.sets).forEach((s,i)=>rows.push([d,L.dayName||"",e.name||"",i+1,fmtKg(num(s.w)),num(s.r),fmtKg(num(s.w)*num(s.r))]))}}
  const cell=v=>{const s=String(v??"");return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};

}

function fromDocs(docs){
  const next={profiles:[{id:"main",name:"Yo",color:COLORS[0]}],active:ALL.active,data:{main:{routine:{days:[]},logs:{}}}};
  for(const {id,data:v} of docs){if(!v)continue;
    if(id==="profiles"){if(Array.isArray(v.list)&&v.list.length)next.profiles=JSON.parse(JSON.stringify(v.list));continue}
    let pid="main",k=id;const t=id.indexOf("~");if(t>0){pid=id.slice(0,t);k=id.slice(t+1)}
    const D=next.data[pid]||(next.data[pid]={routine:{days:[]},logs:{}});
    if(k==="routine")D.routine.days=JSON.parse(JSON.stringify(v.days||[]));else if(k.startsWith("log-"))D.logs[k.slice(4)]=JSON.parse(JSON.stringify(v));
  }
  next.profiles.forEach(p=>{if(!next.data[p.id])next.data[p.id]={routine:{days:[]},logs:{}}});
  if(!next.profiles.find(p=>p.id===next.active))next.active=next.profiles[0].id;
  return next;
}

  if(A.filter==="admins")L=L.filter(u=>u.isAdmin);else if(A.filter==="activos")L=L.filter(act);else if(A.filter==="inactivos")L=L.filter(u=>!act(u));
  const by={recientes:(a,b)=>new Date(b.createdAt)-new Date(a.createdAt),actividad:(a,b)=>new Date(b.lastActivity||0)-new Date(a.lastActivity||0),nombre:(a,b)=>a.name.localeCompare(b.name,"es"),entrenos:(a,b)=>b.workouts-a.workouts};
  return L.sort(by[A.sort]);
}
function barChart(daily){
  const W=340,H=130,L=24,B=20,T=8,R=4;const max=Math.max(2,...daily.map(d=>d.n));const step=max<=4?1:Math.ceil(max/4);const top=Math.ceil(max/step)*step;
  const bw=(W-L-R)/daily.length;const y=v=>T+(H-T-B)*(1-v/top);
  let g="";for(let v=0;v<=top;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="Figtree,sans-serif">${v}</text>`;
  const bars=daily.map((d,i)=>d.n?`<rect x="${(L+i*bw+1.5).toFixed(1)}" y="${y(d.n).toFixed(1)}" width="${Math.max(2,bw-3).toFixed(1)}" height="${(H-B-y(d.n)).toFixed(1)}" rx="2" fill="var(--accent)"><title>${shortDate(d.date)}: ${d.n} entreno${d.n===1?"":"s"}</title></rect>`:"").join("");
  const lab=[0,Math.floor(daily.length/2),daily.length-1].map(i=>`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-5}" text-anchor="${i===0?"start":i===daily.length-1?"end":"middle"}" font-size="10" fill="var(--muted)" font-family="Figtree,sans-serif">${shortDate(daily[i].date)}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entrenos por día en los últimos 30 días">${g}${bars}${lab}</svg>`;
}
const userLine=u=>`<button class="urow" data-act="admopen" data-id="${u.id}"><span class="avatar" style="background:${u.isAdmin?COLORS[0]:COLORS[3]}">${initials(u.name)}</span><span class="uinfo"><b>${esc(u.name)}</b>${u.isAdmin?` <span class="badge pr">Admin</span>`:""}<span class="hint">@${esc(u.username)} · ${ago(u.lastActivity)}</span></span><span class="unum"><b>${u.workouts}</b><span class="hint">entrenos</span></span></button>`;
function vAdmin(){
  let h=`<div class="adm-top"><button class="btn small ghost" data-act="profiles" style="padding-left:0">← Tu cuenta</button><button class="btn small ghost" data-act="admreload" aria-label="Actualizar datos">Actualizar</button></div><span class="eyebrow">Superadmin</span><h2 class="sec" style="margin-bottom:12px">Panel de administración</h2>`;
  if(A.view!=="user")h+=`<div class="seg" role="tablist">${[["resumen","Resumen"],["usuarios","Usuarios"],["actividad","Actividad"]].map(([k,l])=>`<button role="tab" aria-selected="${A.view===k}" data-act="admview" data-v="${k}">${l}</button>`).join("")}</div>`;
  if(!ADM)return h+`<div class="card empty">Cargando datos…</div>`;
  if(ADM.err)return h+`<div class="card"><p class="err">${esc(ADM.err)}</p><button class="btn small" data-act="admreload">Reintentar</button></div>`;
  const S2=ADM.stats;
  if(A.view==="resumen"){
    h+=`<div class="kpis"><div class="stat"><b>${S2.users}</b><span>usuarios · ${S2.new7} nuevos esta semana</span></div><div class="stat"><b>${S2.active7}</b><span>activos 7 días · ${S2.active30} en 30</span></div><div class="stat"><b>${fmtN(S2.workouts)}</b><span>entrenos apuntados</span></div><div class="stat"><b>${tons(S2.volume)}</b><span>levantados · ${fmtN(S2.sets)} series</span></div></div>`;
    h+=`<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:6px"><b>Entrenos por día</b><span class="hint">últimos 30 días</span></div>${barChart(ADM.daily)}</div>`;
    const top=ADM.users.filter(u=>u.workouts).sort((a,b)=>b.workouts-a.workouts).slice(0,5);
    h+=`<div class="eyebrow" style="margin:16px 0 8px">Quién más entrena</div><div class="card ulist">${top.length?top.map(userLine).join(""):`<p class="hint" style="margin:0">Todavía nadie ha apuntado entrenos.</p>`}</div>`;
    const recent=ADM.users.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,5);
    h+=`<div class="eyebrow" style="margin:16px 0 8px">Últimas altas</div><div class="card ulist">${recent.map(userLine).join("")}</div>`;
    return h;
  }
  if(A.view==="actividad"){
    h+=ADM.activity.length?`<div class="card hist">${ADM.activity.map(a=>`<button class="h" data-act="admopen" data-id="${a.userId}" style="background:none;border:0;border-top:1px solid var(--line);text-align:left;width:100%;grid-template-columns:62px minmax(0,1fr) auto"><span class="dt">${shortDate(a.date)}</span><span style="min-width:0"><b style="font-weight:600">${esc(a.name)}</b> <span class="hint">· ${esc(a.dayName||"Entreno")}</span><br><span class="hint">${a.exercises} ejercicios · ${a.sets} series</span></span><span class="hint">${tons(a.volume)}</span></button>`).join("")}</div>`:`<div class="card empty">Aún no hay entrenos apuntados.</div>`;
    return h;
  }
  if(A.view==="usuarios"){
    const L=admUsers();
    h+=`<div class="row" style="gap:8px;margin-bottom:10px"><input class="txt" id="admq" type="search" placeholder="Buscar por nombre, usuario o email" value="${esc(A.q)}" aria-label="Buscar usuarios"></div>
    <div class="chips" role="group" aria-label="Filtrar" style="margin-bottom:10px">${[["todos","Todos"],["activos","Activos"],["inactivos","Inactivos"],["admins","Admins"]].map(([k,l])=>`<button class="chip" aria-pressed="${A.filter===k}" data-act="admfilter" data-v="${k}">${l}</button>`).join("")}</div>
    <div class="row" style="gap:8px;margin-bottom:12px"><select class="sel" id="admsort" aria-label="Ordenar" style="flex:1">${[["recientes","Altas más recientes"],["actividad","Última actividad"],["nombre","Nombre"],["entrenos","Más entrenos"]].map(([k,l])=>`<option value="${k}" ${A.sort===k?"selected":""}>${l}</option>`).join("")}</select><button class="btn" data-act="admcsv">Exportar CSV</button></div>`;
    h+=A.creating?`<form class="card stack" id="admnew" novalidate style="margin-bottom:12px"><b>Nuevo usuario</b>
      <label class="lab">Nombre<input class="txt" id="n-name" placeholder="Nombre y apellido" autocomplete="off"></label>
      <label class="lab">Usuario<input class="txt" id="n-user" placeholder="nombre.usuario" autocapitalize="none" autocomplete="off"></label>
      <label class="lab">Email<input class="txt" id="n-email" type="email" placeholder="correo@ejemplo.com" autocapitalize="none" autocomplete="off"></label>
      <label class="lab">Contraseña${pwField("n-pass","new-password","Mínimo 6 caracteres")}</label>
      <label class="check"><input type="checkbox" id="n-admin"> Darle permisos de administrador</label>
      ${A.err?`<p class="err" role="alert">${esc(A.err)}</p>`:""}
      <div class="row"><button class="btn primary" type="submit">Crear usuario</button><button class="btn ghost" type="button" data-act="admnewcancel">Cancelar</button></div></form>`
      :`<button class="btn primary" data-act="admnewopen" style="width:100%;margin-bottom:12px">+ Crear usuario</button>`;
    h+=`<p class="hint" style="margin:0 0 8px">${L.length} de ${ADM.users.length} usuarios</p>`;
    h+=L.length?`<div class="card ulist">${L.map(userLine).join("")}</div>`:`<div class="card empty">Ningún usuario coincide con la búsqueda.</div>`;
    return h;
  }
  /* ficha de usuario */
  h=`<div class="adm-top"><button class="btn small ghost" data-act="admback" style="padding-left:0">← Usuarios</button></div>`;
  if(!DET)return h+`<div class="card empty">Cargando usuario…</div>`;
  if(DET.err)return h+`<div class="card"><p class="err">${esc(DET.err)}</p></div>`;
  const U=DET.user;const me=U.id===SERVER.user.id;const sum=ADM.users.find(x=>x.id===U.id)||{workouts:0,sets:0,volume:0};
  const D=fromDocs(DET.docs.map(d=>({id:d.key,data:d.data})));
  h+=`<div class="row" style="gap:12px;margin-bottom:12px"><span class="avatar big" style="background:${U.isAdmin?COLORS[0]:COLORS[3]}">${initials(U.name)}</span><div style="min-width:0"><h2 class="sec" style="font-size:26px">${esc(U.name)}</h2><span class="hint">@${esc(U.username)}${U.isAdmin?" · Administrador":""}${me?" · Tú":""}</span></div></div>`;
  h+=`<div class="kpis"><div class="stat"><b>${sum.workouts}</b><span>entrenos</span></div><div class="stat"><b>${fmtN(sum.sets)}</b><span>series</span></div><div class="stat"><b>${tons(sum.volume)}</b><span>levantados</span></div><div class="stat"><b>${U.sessions}</b><span>sesiones abiertas</span></div></div>`;
  h+=`<div class="card stack"><div class="hint">Alta el ${longDate(dayOf(U.createdAt))} · última vez ${ago(U.lastSeen)}${sum.lastWorkout?" · último entreno "+shortDate(sum.lastWorkout):""}</div>
    <form class="stack" id="admedit" novalidate>
    <label class="lab">Nombre<input class="txt" id="e-name" value="${esc(U.name)}" autocomplete="off"></label>
    <label class="lab">Usuario<input class="txt" id="e-user" value="${esc(U.username)}" autocapitalize="none" autocomplete="off"></label>
    <label class="lab">Email<input class="txt" id="e-email" type="email" value="${esc(U.email||"")}" placeholder="Sin email" autocapitalize="none" autocomplete="off"></label>
    ${A.msg&&A.msg.k==="edit"?`<p class="${A.msg.c}" role="status">${esc(A.msg.t)}</p>`:""}
    <button class="btn" type="submit">Guardar cambios</button></form></div>`;
  h+=`<div class="card stack" style="margin-top:12px"><b>Acciones</b>
    ${me?`<p class="hint" style="margin:0">Es tu propia cuenta: tu contraseña se cambia desde «Tu cuenta».</p>`:`
    <form class="stack" id="admpw" novalidate><label class="lab">Nueva contraseña${pwField("e-pass","new-password","Mínimo 6 caracteres")}</label>${A.msg&&A.msg.k==="pw"?`<p class="${A.msg.c}" role="status">${esc(A.msg.t)}</p>`:""}<button class="btn" type="submit">Cambiar contraseña</button></form>
    <div class="row" style="flex-wrap:wrap;gap:8px"><button class="btn small" data-act="admtoggle" data-id="${U.id}">${U.isAdmin?"Quitar permisos de admin":"Hacer administrador"}</button><button class="btn small" data-act="admkick" data-id="${U.id}">Cerrar sus sesiones</button></div>
    ${A.confirm==="del"?`<div class="confirm">Se borrará la cuenta de ${esc(U.name)} con toda su rutina e historial. No se puede deshacer. <button class="btn small" data-act="admdel" data-id="${U.id}" style="color:var(--down)">Eliminar cuenta</button><button class="btn small ghost" data-act="admcancel">Cancelar</button></div>`:`<button class="btn small ghost" style="color:var(--down);align-self:flex-start;padding-left:0" data-act="admdelask">Eliminar cuenta</button>`}`}
  </div>`;
  for(const p of D.profiles){const P=D.data[p.id];if(!P)continue;
    if(D.profiles.length>1)h+=`<div class="eyebrow" style="margin:18px 0 0">Perfil · ${esc(p.name)}</div>`;
    h+=`<div class="eyebrow" style="margin:16px 0 8px">Rutina</div>`;
    h+=P.routine.days.length?`<div class="stack">${P.routine.days.map(d=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(d.name)}</b><span class="hint">${(d.wd||[]).length?(d.wd||[]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(w=>DIA[w].slice(0,3)).join(", "):"Sin día fijo"}</span></div>${d.ex.length?`<div class="hint" style="margin-top:6px">${d.ex.map(x=>`${esc(x.name||"Ejercicio")} ${x.sets}×${esc(x.reps)}`).join(" · ")}</div>`:""}</div>`).join("")}</div>`:`<div class="card empty">Sin rutina.</div>`;
    const ds=Object.keys(P.logs).sort().reverse().slice(0,8);
    h+=`<div class="eyebrow" style="margin:16px 0 8px">Últimos entrenos</div>`;
    h+=ds.length?`<div class="card hist">${ds.map(d=>{const L=P.logs[d];return`<div class="h" style="grid-template-columns:62px minmax(0,1fr)"><span class="dt">${shortDate(d)}</span><span><b style="font-weight:600">${esc(L.dayName||"Entreno")}</b>${Object.values(L.entries||{}).map(e=>`<span class="hint" style="display:block">${esc(e.name)}: ${setsText(e.sets)||"—"}</span>`).join("")}</span></div>`}).join("")}</div>`:`<div class="card empty">Sin entrenos apuntados.</div>`;
  }
  return h;
}
function csvDownload(){
  const cols=[["Nombre","name"],["Usuario","username"],["Email","email"],["Admin",u=>u.isAdmin?"sí":"no"],["Alta",u=>dayOf(u.createdAt)],["Última actividad",u=>dayOf(u.lastActivity)],["Entrenos","workouts"],["Series","sets"],["Kg levantados","volume"]];
  const cell=v=>{const s=String(v??"");return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=[cols.map(c=>c[0]).join(";")].concat(admUsers().map(u=>cols.map(([,k])=>cell(typeof k==="function"?k(u):u[k])).join(";")));
  const blob=new Blob(["﻿"+rows.join("\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="liftlog-usuarios-"+TODAY+".csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
document.addEventListener("input",e=>{if(e.target.id==="admq"){A.q=e.target.value;const pos=e.target.selectionStart;render();const i=$("#admq");if(i){i.focus();i.setSelectionRange(pos,pos)}}});
document.addEventListener("change",e=>{if(e.target.id==="admsort"){A.sort=e.target.value;render()}});
document.addEventListener("submit",async e=>{
  const f=e.target;
  if(f.id==="pwform"){e.preventDefault();
    const cur=$("#pw-cur").value,nw=$("#pw-new").value;
    if(!cur||!nw){ui.pwMsg=["err","Rellena las dos contraseñas."];return render()}
    try{await api("POST","/api/password",{current:cur,next:nw});ui.pwMsg=["hint","Contraseña cambiada."]}catch(err){ui.pwMsg=["err",err.message]}render();return}
  if(f.id==="admnew"){e.preventDefault();
    const body={name:$("#n-name").value,username:$("#n-user").value,email:$("#n-email").value,password:$("#n-pass").value,isAdmin:$("#n-admin").checked};
    try{await api("POST","/api/admin/users",body);A.creating=false;A.err=null;toast("Usuario creado");await loadAdmin()}catch(err){A.err=err.message;render()}return}
  if(f.id==="admedit"){e.preventDefault();
    try{await api("PATCH","/api/admin/users/"+A.userId,{name:$("#e-name").value,username:$("#e-user").value,email:$("#e-email").value});A.msg={k:"edit",c:"hint",t:"Cambios guardados."};await loadAdmin();await loadDetail(A.userId)}catch(err){A.msg={k:"edit",c:"err",t:err.message};render()}return}
  if(f.id==="admpw"){e.preventDefault();
    try{await api("POST","/api/admin/users/"+A.userId+"/password",{password:$("#e-pass").value});A.msg={k:"pw",c:"hint",t:"Contraseña cambiada. Sus sesiones abiertas se han cerrado."};loadDetail(A.userId)}catch(err){A.msg={k:"pw",c:"err",t:err.message};render()}return}
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b||!SERVER)return;const id=b.dataset.id;
  try{switch(b.dataset.act){
    case"admin":ui.tab="admin";A.view="resumen";ADM=null;render();loadAdmin();toTop();return;
    case"admreload":ADM=null;render();await loadAdmin();if(A.view==="user")loadDetail(A.userId);return;
    case"admview":A.view=b.dataset.v;A.confirm=null;render();toTop();return;
    case"admfilter":A.filter=b.dataset.v;render();return;
    case"admnewopen":A.creating=true;A.err=null;render();$("#n-name")?.focus();return;
    case"admnewcancel":A.creating=false;A.err=null;render();return;
    case"admcsv":csvDownload();return;
    case"admopen":A.view="user";A.userId=id;A.confirm=null;A.msg=null;toTop();loadDetail(id);return;
    case"admback":A.view="usuarios";A.confirm=null;A.msg=null;render();return;
    case"admcancel":A.confirm=null;render();return;
    case"admdelask":A.confirm="del";render();return;
    case"admtoggle":{await api("POST","/api/admin/users/"+id+"/admin",{isAdmin:!DET.user.isAdmin});toast(DET.user.isAdmin?"Permisos de admin quitados":"Ahora es administrador");await loadAdmin();loadDetail(id);return}
    case"admkick":await api("POST","/api/admin/users/"+id+"/logout");toast("Sesiones cerradas");loadDetail(id);return;
    case"admdel":await api("DELETE","/api/admin/users/"+id);toast("Cuenta eliminada");A.view="usuarios";A.confirm=null;await loadAdmin();return;
  }}catch(err){toast(err.message)}
});

function vPerfiles(){
  let h=`<span class="eyebrow">${SERVER?"Tu cuenta":"Quién entrena"}</span><h2 class="sec" style="margin-bottom:12px">${SERVER?esc(SERVER.user.name):"Usuarios"}</h2>`;
  if(SERVER){
    const U=SERVER.user;
    h+=`<div class="card stack"><div class="row"><span class="avatar big" style="background:${COLORS[0]}">${initials(U.name)}</span><div style="min-width:0"><b>${esc(U.name)}</b> ${U.isAdmin?`<span class="badge pr">Superadmin</span>`:""}<br><span class="hint">@${esc(U.username)}${U.email?" · "+esc(U.email):""}</span></div></div>
    <p class="hint" style="margin:0">Cada persona que quiera usar Liftlog crea su propia cuenta desde la pantalla de entrada. Sus rutinas y registros son solo suyos.</p>
    ${U.isAdmin?`<button class="btn primary" data-act="admin">Abrir panel de administración</button>`:""}
    <button class="btn" data-act="logout">Cerrar sesión</button></div>
    <form class="card stack" id="pwform" style="margin-top:12px" novalidate><b>Cambiar contraseña</b>
    <label class="lab">Contraseña actual${pwField("pw-cur","current-password")}</label>
    <label class="lab">Nueva contraseña${pwField("pw-new","new-password","Mínimo 6 caracteres")}</label>
    ${ui.pwMsg?`<p class="${ui.pwMsg[0]}" role="status">${esc(ui.pwMsg[1])}</p>`:""}
    <button class="btn" type="submit">Guardar contraseña</button></form>`;
    return h;
  }
  h+=`<div class="stack">${ALL.profiles.map(p=>{const D=ALL.data[p.id];const n=D?Object.keys(D.logs).length:0;const act=p.id===ALL.active;
    return`<div class="card"><div class="row"><span class="avatar big" style="background:${p.color}">${initials(p.name)}</span><div style="flex:1;min-width:0"><input class="txt title" id="pn-${p.id}" data-profname="${p.id}" value="${esc(p.name)}" aria-label="Nombre del usuario"><span class="hint">${n} entreno${n===1?"":"s"} apuntado${n===1?"":"s"}</span></div></div>
    <div class="row" style="margin-top:10px">${act?`<span class="badge pr">Activo</span>`:`<button class="btn small primary" data-act="useprof" data-id="${p.id}">Usar este usuario</button>`}${ALL.profiles.length>1?`<button class="btn small ghost" style="margin-left:auto" data-act="delprof" data-id="${p.id}">Eliminar</button>`:""}</div>
    ${ui.confirm==="delprof:"+p.id?`<div class="confirm">Se borrará su rutina y todo su historial. <button class="btn small" data-act="delprofyes" data-id="${p.id}" style="color:var(--down)">Eliminar</button><button class="btn small ghost" data-act="clearno">Cancelar</button></div>`:""}</div>`}).join("")}</div>
  <div class="card" style="margin-top:12px"><label class="lab" for="newprof">Nuevo usuario</label><div class="row" style="margin-top:6px"><input class="txt" id="newprof" placeholder="Nombre" autocomplete="off"><button class="btn primary" data-act="addprof">Crear</button></div>${ui.profErr?`<p class="err" role="alert">${esc(ui.profErr)}</p>`:""}</div>`;
  return h;
}

(async()=>{
  /* 1) ¿Estamos en el servidor propio? */
  try{
    const r=await fetch("/api/me",{credentials:"same-origin"});
    const ct=r.headers.get("content-type")||"";
    if(ct.includes("application/json")){
      document.documentElement.dataset.mode="server";checkUpdate();
      if(r.ok){const j=await r.json();await startServer(j.user,false)}else showAuth();
      return;
    }
  }catch(e){}
  /* 2) Dentro de Claude: guardado privado en la cuenta */
  try{
    if(!window.claude?.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const col=db.collection("data/users/"+id);
    store={ref:k=>col.doc(k),col};
    const snap=await col.get();
    if(snap.empty){await pushAll();setSync(true)}
    else adopt(snap.docs.map(d=>({id:d.id,data:d.data()})));
  }catch(e){setSync(false)}
})();
</script>
